<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2c24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scopa">
<title>Scopa tra Amici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen card table — scores on top, opponents, green felt in the middle, your hand docked at the bottom */
:root{
  --felt:#15463a; --felt-2:#0c2c24; --felt-line:#2c6553; --ink:#f4ecda; --muted:#a8c4b7;
  --card:#fbf5e6; --card-edge:#d9cba9; --card-ink:#231d16;
  --red:#b3262d; --blue:#22509b; --gold:#c08a1e; --green:#2e6a35; --accent:#e8b84f; --danger:#e3685f;
  --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:radial-gradient(120% 80% at 50% 35%, var(--felt) 0%, var(--felt-2) 75%) fixed, var(--felt-2); color:var(--ink); font-family:var(--body); font-size:15px; -webkit-tap-highlight-color:transparent; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:760px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; gap:14px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:14px 20px}
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; text-wrap:balance}
h1{font-size:2.4rem; line-height:1}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0; line-height:1.45}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700}
button{font:inherit; cursor:pointer; border:0; border-radius:10px; padding:11px 16px; font-weight:700; background:var(--accent); color:#2a1d05; min-height:44px}
button.ghost{background:transparent; color:var(--ink); border:1px solid var(--felt-line)}
button.danger{background:transparent; color:var(--danger); border:1px solid var(--danger)}
button.small{min-height:32px; padding:4px 10px; font-size:.8rem}
button:disabled{opacity:.45; cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input,select{font:inherit; font-size:16px; width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--felt-line); background:rgba(0,0,0,.25); color:var(--ink); min-height:44px}
input.code{text-transform:uppercase; letter-spacing:.3em; font-weight:700}
label{display:flex; flex-direction:column; gap:6px; font-size:.85rem; color:var(--muted); font-weight:600}
.panel{background:rgba(5,25,19,.55); border:1px solid var(--felt-line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.row > *{min-width:0}
.grow{flex:1}
.seg{display:flex; gap:6px}
.seg button{flex:1; background:transparent; color:var(--ink); border:1px solid var(--felt-line); padding-inline:6px}
.seg button[aria-pressed="true"]{background:var(--accent); color:#2a1d05; border-color:var(--accent)}
.err{color:var(--danger); font-size:.9rem; min-height:1.2em}
.pill{font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:99px; border:1px solid var(--felt-line); color:var(--muted); white-space:nowrap}
.pill.ok{color:#8fd19e; border-color:#3f7f53}
.pill.bad{color:var(--danger); border-color:var(--danger)}
.hero{display:flex; align-items:flex-end; gap:14px; padding-top:6px}
.hero .fan{display:flex; flex:none}
.hero .fan .card{--w:38px; margin-left:-14px}
.hero .fan .card:first-child{margin-left:0; transform:rotate(-10deg)}
.hero .fan .card:last-child{transform:rotate(10deg)}
.bigcode{font-family:var(--display); font-size:2.6rem; letter-spacing:.18em; color:var(--accent); text-align:center}

/* Cards */
.card{--w:64px; width:var(--w); height:calc(var(--w)*1.6); flex:none; position:relative; background:var(--card); border:1px solid var(--card-edge); border-radius:calc(var(--w)*.11); color:var(--sc); box-shadow:0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; padding:0; min-height:0; font-weight:400; transition:transform .15s ease, box-shadow .15s ease}
.card::before{content:""; position:absolute; inset:calc(var(--w)*.06); border:1.5px solid var(--sc); border-radius:calc(var(--w)*.07); opacity:.55}
.card .rk{position:absolute; top:calc(var(--w)*.08); left:calc(var(--w)*.1); font-family:var(--display); font-size:calc(var(--w)*.21); line-height:1; z-index:1}
.card .rk.b{top:auto; left:auto; bottom:calc(var(--w)*.08); right:calc(var(--w)*.1); transform:rotate(180deg)}
.card .face{position:absolute; inset:0; width:100%; height:100%; display:block}
.card.s-d{--sc:var(--gold)} .card.s-c{--sc:var(--red)} .card.s-s{--sc:var(--blue)} .card.s-b{--sc:var(--green)}
.back{background:repeating-linear-gradient(45deg, #7d1f24 0 4px, #93282e 4px 8px); border:2px solid var(--card); --sc:var(--card)}
.back::before{opacity:.5}

.hand{display:flex; justify-content:center; gap:10px; padding-top:12px; min-height:calc(clamp(72px, 24vw, 104px)*1.6 + 12px)}
.hand .card{--w:clamp(72px, 24vw, 104px)}
.hand .card.sel{transform:translateY(-12px); box-shadow:0 0 0 3px var(--accent), 0 10px 20px rgba(0,0,0,.35)}
.hand.off .card{filter:saturate(.7) brightness(.9)}
.hand .card:disabled{opacity:.85}
.felt{flex:1; min-height:210px; border-radius:22px; border:2px solid var(--felt-line); background:radial-gradient(100% 100% at 50% 40%, rgba(255,255,255,.05), rgba(0,0,0,.18)); padding:34px 14px 14px; display:flex; flex-direction:column; gap:12px; position:relative}
.tablecards{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-content:center; flex:1}
.tablecards .card{--w:clamp(52px, 15vw, 72px)}
.tablecards .card.opt{box-shadow:0 0 0 3px var(--accent), 0 6px 14px rgba(0,0,0,.3)}
.tablecards .card.fresh{animation:drop .45s ease}
@keyframes drop{from{transform:translateY(-24px) scale(1.06); opacity:.2}to{transform:none; opacity:1}}
.empty-felt{color:var(--muted); font-family:var(--display); font-size:1.3rem; text-align:center; margin:auto}
.deck{position:absolute; top:10px; right:12px; display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--muted)}
.deck .card{--w:16px; box-shadow:none}
.conn{position:absolute; top:10px; left:12px}
.banner{font-size:.9rem; text-align:center; min-height:1.3em}
.banner b{color:var(--accent)}
.scopa{font-family:var(--display); color:var(--accent); font-size:1.15rem}
.scorebar{display:flex; gap:8px; flex-wrap:wrap}
.score{flex:1; min-width:120px; padding:8px 12px; border-radius:12px; background:rgba(0,0,0,.22); border:1px solid var(--felt-line); display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.score.mine{border-color:var(--accent)}
.score span{font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.score b{font-family:var(--display); font-size:1.5rem; font-weight:400; font-variant-numeric:tabular-nums}
.opps{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.opp{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; border:1px solid var(--felt-line); background:rgba(0,0,0,.15); min-width:0}
.opp.turn{border-color:var(--accent); box-shadow:0 0 0 2px rgba(232,184,79,.25)}
.opp.away{opacity:.55}
.opp .nm{font-weight:700; max-width:9em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.opp .sub{font-size:.75rem; color:var(--muted)}
.backs{display:flex}
.backs .card{--w:18px; margin-left:-8px; box-shadow:none}
.backs .card:first-child{margin-left:0}
.status{text-align:center; font-weight:700}
.status.me{color:var(--accent)}
.actions{display:flex; flex-direction:column; gap:8px; min-height:44px}
.actions button{width:100%}
.mystats{display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); gap:8px; flex-wrap:wrap}
.top{display:flex; justify-content:space-between; align-items:center; gap:10px}
.overlay{position:fixed; inset:0; background:rgba(4,16,12,.8); display:flex; align-items:center; justify-content:center; padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); z-index:20; overflow:auto}
.overlay .panel{width:100%; max-width:480px; background:var(--felt-2)}
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th,td{padding:7px 6px; text-align:center; border-bottom:1px solid var(--felt-line); font-size:.9rem}
th:first-child,td:first-child{text-align:left}
td.win{color:var(--accent); font-weight:700}
tr.tot td{font-weight:700; border-bottom:0}
.seats{display:flex; flex-direction:column; gap:8px}
.seat{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; border:1px dashed var(--felt-line)}
.seat.full{border-style:solid; background:rgba(0,0,0,.18)}
.toast{position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#2a1d05; color:var(--accent); padding:10px 16px; border-radius:10px; font-weight:600; z-index:30; max-width:calc(100% - 32px)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div id="app"><p class="muted">Carico il tavolo…</p></div>
<div id="toast" class="toast" hidden></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ================= Card model =================
const SUITS = {d:'Denari', c:'Coppe', s:'Spade', b:'Bastoni'};
const FIG = {8:['F','Fante'], 9:['C','Cavallo'], 10:['R','Re']};
const PRIM = {7:21, 6:18, 1:16, 5:15, 4:14, 3:13, 2:12, 8:10, 9:10, 10:10};
const rank = id => +id.slice(1), suit = id => id[0];
const cardName = id => (FIG[rank(id)] ? FIG[rank(id)][1] : rank(id)) + ' di ' + SUITS[suit(id)];
// Piacentine-style deck, drawn from scratch: Spanish suits, corner numbers, pips laid out by count, full-length figures.
const PIPS = {
  d:'<circle cx="20" cy="20" r="17" fill="#e2b34a" stroke="#8a6414" stroke-width="2"/><circle cx="20" cy="20" r="12" fill="none" stroke="#8a6414" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M20 7l3.2 9.8L33 20l-9.8 3.2L20 33l-3.2-9.8L7 20l9.8-3.2z" fill="#b3262d" stroke="#6e1418" stroke-width=".8"/><circle cx="20" cy="20" r="3" fill="#e2b34a"/>',
  c:'<path d="M7 5h26c0 11-6 17-13 18C13 22 7 16 7 5z" fill="#c8302f" stroke="#6e1418" stroke-width="1.5"/><path d="M8.5 8.5h23" stroke="#e2b34a" stroke-width="2.4"/><path d="M17 23h6l-1 3h-4z" fill="#e2b34a" stroke="#8a6414" stroke-width=".8"/><rect x="18.2" y="26" width="3.6" height="5" fill="#e2b34a"/><path d="M11 37h18l-4-6H15z" fill="#c8302f" stroke="#6e1418" stroke-width="1.5"/>',
  s:'<path d="M20 1l3.4 5v22h-6.8V6z" fill="#e6ecf4" stroke="#22509b" stroke-width="1.4"/><path d="M20 6v21" stroke="#9fb3cf" stroke-width="1"/><path d="M8 27.5c4-2 20-2 24 0v3c-4-2-20-2-24 0z" fill="#e2b34a" stroke="#8a6414" stroke-width="1"/><rect x="18" y="30.5" width="4" height="5.5" fill="#22509b"/><circle cx="20" cy="37.4" r="2.4" fill="#e2b34a" stroke="#8a6414" stroke-width=".8"/>',
  b:'<path d="M15 2.5c4-1.6 9 .3 9.8 4.3l4.6 26c.5 3.2-2 5.4-5 5.4s-5.2-2-5.4-4.3L13.4 8.3c-.5-2.4.4-4.8 1.6-5.8z" fill="#9a6532" stroke="#4e2f12" stroke-width="1.3"/><path d="M14.5 9.5l-3-2M17.8 17l-3.4-1M20 25.5l-3.4.4M23 12l3.2-1.6M25 21l3.4-.6" stroke="#4e2f12" stroke-width="1.6" stroke-linecap="round"/><path d="M17 8c2 2 4 2 6 1M19 16c2 2 4 2 6 1M21 25c2 2 4 2 6 1" stroke="#2e6a35" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
};
const SC = {d:'#c08a1e', c:'#b3262d', s:'#22509b', b:'#2e6a35'};
const LAYOUT = {
  1:[[50,80]], 2:[[50,42],[50,118]], 3:[[50,34],[50,80],[50,126]],
  4:[[33,42],[67,42],[33,118],[67,118]], 5:[[33,40],[67,40],[50,80],[33,120],[67,120]],
  6:[[33,36],[67,36],[33,80],[67,80],[33,124],[67,124]], 7:[[33,34],[67,34],[50,57],[33,80],[67,80],[33,126],[67,126]]
};
const pip = (s, cx, cy, size, flip) => `<use href="#pip-${s}" x="${cx - size / 2}" y="${cy - size / 2}" width="${size}" height="${size}"${flip ? ` transform="rotate(180 ${cx} ${cy})"` : ''}/>`;
const HEAD = (cy, beard) => `<circle cx="50" cy="${cy}" r="9" fill="#f1cda6" stroke="#3a2a1a" stroke-width="1.2"/><circle cx="46.5" cy="${cy - 1}" r="1" fill="#3a2a1a"/><circle cx="53.5" cy="${cy - 1}" r="1" fill="#3a2a1a"/>${beard ? `<path d="M42 ${cy + 3}q8 14 16 0q-8 4-16 0z" fill="#7a5a3a"/>` : `<path d="M47 ${cy + 4}q3 2 6 0" stroke="#3a2a1a" stroke-width="1" fill="none"/>`}`;
function figureSVG(r, s) {
  const col = SC[s], ink = 'stroke="#2a1d10" stroke-width="1.3"';
  if (r === 8) return `
    <rect x="41" y="106" width="7" height="30" fill="#3a2a1a"/><rect x="52" y="106" width="7" height="30" fill="#3a2a1a"/>
    <path d="M38 136h11v5H35zM51 136h11l3 5H51z" fill="#3a2a1a"/>
    <path d="M37 56h26l7 52H30z" fill="${col}" ${ink}/><path d="M50 56v52" stroke="#e2b34a" stroke-width="2"/>
    <rect x="31" y="98" width="38" height="5" fill="#e2b34a" ${ink}/>
    <path d="M37 60l-8 26 5 2 8-22z" fill="${col}" ${ink}/>
    ${HEAD(44, false)}
    <path d="M38 41c0-12 24-12 24 0z" fill="#e2b34a" ${ink}/><path d="M58 33c6-6 10-6 13-4-5 0-8 3-11 6z" fill="${col}"/>
    ${pip(s, 70, 74, 26)}`;
  if (r === 9) return `
    <path d="M14 104c2-14 16-20 36-20s30 6 34 18l-3 10H18z" fill="#a8743f" ${ink}/>
    <rect x="22" y="110" width="6" height="30" fill="#a8743f" ${ink}/><rect x="34" y="110" width="6" height="28" fill="#a8743f" ${ink}/><rect x="62" y="110" width="6" height="28" fill="#a8743f" ${ink}/><rect x="74" y="108" width="6" height="32" fill="#a8743f" ${ink}/>
    <path d="M74 98l8-28c4-4 12-2 14 4l-4 10-6 2-2 14z" fill="#a8743f" ${ink}/><circle cx="88" cy="76" r="1.4" fill="#2a1d10"/><path d="M78 72l6-10" stroke="#5a3a1a" stroke-width="2.5"/>
    <path d="M14 104c-6 6-8 16-6 22" stroke="#5a3a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M36 90h28l-4 10H40z" fill="${col}" ${ink}/>
    <path d="M41 58h18l5 34H36z" fill="${col}" ${ink}/><path d="M50 58v34" stroke="#e2b34a" stroke-width="2"/>
    ${HEAD(48, false)}
    <path d="M40 44c0-11 20-11 20 0l4 2H36z" fill="#3a2a1a"/>
    ${pip(s, 26, 62, 24)}`;
  return `
    <path d="M34 58h32l12 82H22z" fill="${col}" ${ink}/>
    <path d="M47 58h6v82h-6z" fill="#f4ecda" stroke="#2a1d10" stroke-width=".8"/><path d="M49 70v4M51 88v4M49 106v4M51 124v4" stroke="#2a1d10" stroke-width="1.6"/>
    <path d="M22 140h56" stroke="#e2b34a" stroke-width="4"/>
    <path d="M34 60l-10 30 6 2 10-26z" fill="${col}" ${ink}/>
    ${HEAD(46, true)}
    <path d="M39 38l2-12 5 6 4-9 4 9 5-6 2 12z" fill="#e2b34a" ${ink}/><circle cx="50" cy="30" r="1.6" fill="#b3262d"/>
    ${pip(s, 70, 76, 28)}`;
}
function faceSVG(id) {
  const r = rank(id), s = suit(id);
  let body;
  if (FIG[r]) body = figureSVG(r, s);
  else if (r === 1) body = `<circle cx="50" cy="80" r="34" fill="none" stroke="${SC[s]}" stroke-width="1" opacity=".35"/>${pip(s, 50, 80, 56)}`;
  else body = LAYOUT[r].map(([x, y]) => pip(s, x, y, r >= 6 ? 24 : 27, (s === 's' || s === 'b') && y > 80)).join('');
  return `<svg class="face" viewBox="0 0 100 160" aria-hidden="true">${body}</svg>`;
}
function cardInner(id) {
  const r = rank(id);
  return `<span class="rk">${r}</span>${faceSVG(id)}<span class="rk b">${r}</span>`;
}
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${Object.entries(PIPS).map(([k, v]) => `<symbol id="pip-${k}" viewBox="0 0 40 40">${v}</symbol>`).join('')}</defs></svg>`);
const cardHTML = (id, cls = '') => `<div class="card s-${suit(id)} ${cls}" aria-label="${cardName(id)}">${cardInner(id)}</div>`;
const backHTML = () => `<div class="card back" aria-hidden="true"></div>`;
function fullDeck() { const d = []; for (const s of 'dcsb') for (let r = 1; r <= 10; r++) d.push(s + r); return d; }
function shuffle(a) { const rnd = new Uint32Array(a.length); crypto.getRandomValues(rnd); for (let i = a.length - 1; i > 0; i--) { const j = rnd[i] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ================= Rules =================
const nTeams = s => s.nPlayers === 4 ? 2 : s.nPlayers;
const teamOf = (s, seat) => s.nPlayers === 4 ? seat % 2 : seat;
const teamName = (s, t) => s.nPlayers === 4 ? [s.players[t], s.players[t + 2]].filter(Boolean).map(p => p.nick).join(' & ') : (s.players[t] ? s.players[t].nick : '—');
function captureOptions(card, table) {
  const v = rank(card);
  const singles = table.filter(c => rank(c) === v);
  if (singles.length) return singles.map(c => [c]);   // a matching single card must be taken first
  const out = [], n = table.length;
  for (let m = 1; m < (1 << n); m++) {
    let sum = 0; const pick = [];
    for (let i = 0; i < n; i++) if (m & (1 << i)) { sum += rank(table[i]); pick.push(table[i]); }
    if (sum === v && pick.length > 1) out.push(pick);
  }
  return out;
}
function dealHand(s) {
  let deck, table;
  do { deck = shuffle(fullDeck()); table = deck.splice(0, 4); } while (table.filter(c => rank(c) === 10).length >= 3);
  const hands = {}, caps = {}, scope = {};
  for (let i = 0; i < s.nPlayers; i++) hands[i] = deck.splice(0, 3);
  for (let t = 0; t < nTeams(s); t++) { caps[t] = []; scope[t] = 0; }
  s.hand = { deck, table, hands, caps, scope, turn: (s.dealer + 1) % s.nPlayers, lastCapTeam: -1, lastMove: null, handNo: (s.hand?.handNo || 0) + 1 };
  s.status = 'playing'; s.result = null;
}
function awardMax(vals, minPositive) {
  const mx = Math.max(...vals); if (minPositive && mx <= 0) return -1;
  return vals.filter(v => v === mx).length === 1 ? vals.indexOf(mx) : -1;
}
function scoreHand(s) {
  const T = [...Array(nTeams(s)).keys()], caps = s.hand.caps;
  const carte = T.map(t => caps[t].length);
  const denari = T.map(t => caps[t].filter(c => suit(c) === 'd').length);
  const sette = T.map(t => caps[t].includes('d7') ? 1 : 0);
  const prim = T.map(t => { let tot = 0; for (const su of 'dcsb') { const vs = caps[t].filter(c => suit(c) === su).map(c => PRIM[rank(c)]); if (!vs.length) return 0; tot += Math.max(...vs); } return tot; });
  const scope = T.map(t => s.hand.scope[t]);
  const wC = awardMax(carte), wD = awardMax(denari), wS = sette.indexOf(1), wP = awardMax(prim, true);
  const pts = T.map(t => (wC === t) + (wD === t) + (wS === t) + (wP === t) + scope[t]);
  return { rows: [
    { k: 'Carte', v: carte, w: wC }, { k: 'Denari', v: denari, w: wD },
    { k: 'Settebello', v: sette.map(x => x ? 'sì' : '—'), w: wS }, { k: 'Primiera', v: prim, w: wP },
    { k: 'Scope', v: scope, w: -2 } ], pts };
}
function endHand(s) {
  const h = s.hand;
  if (h.table.length && h.lastCapTeam >= 0) { h.caps[h.lastCapTeam].push(...h.table); h.lastMove = { ...(h.lastMove || {}), sweep: h.table.length, sweepTeam: h.lastCapTeam }; h.table = []; }
  const r = scoreHand(s);
  for (let t = 0; t < nTeams(s); t++) s.scores[t] = (s.scores[t] || 0) + r.pts[t];
  s.result = r;
  const tot = [...Array(nTeams(s)).keys()].map(t => s.scores[t]);
  const w = awardMax(tot);
  s.status = (Math.max(...tot) >= s.target && w >= 0) ? 'over' : 'handEnd';
  s.winner = s.status === 'over' ? w : -1;
}
function applyMove(s, seat, card, take) {
  const h = s.hand, team = teamOf(s, seat);
  h.hands[seat] = h.hands[seat].filter(c => c !== card);
  let scopa = false;
  if (take.length) {
    h.table = h.table.filter(c => !take.includes(c));
    h.caps[team].push(card, ...take); h.lastCapTeam = team;
    const lastPlay = !h.deck.length && Object.values(h.hands).every(x => !x.length);
    if (!h.table.length && !lastPlay) { scopa = true; h.scope[team]++; }
  } else h.table.push(card);
  h.lastMove = { seat, card, take, scopa };
  h.turn = (seat + 1) % s.nPlayers;
  if (Object.values(h.hands).every(x => !x.length)) {
    if (h.deck.length) for (let i = 0; i < s.nPlayers; i++) h.hands[i] = h.deck.splice(0, 3);
    else endHand(s);
  }
}
function validMove(s, seat, card, take) {
  if (s.status !== 'playing' || s.hand.turn !== seat) return false;
  if (!s.hand.hands[seat].includes(card) || !Array.isArray(take)) return false;
  const opts = captureOptions(card, s.hand.table);
  if (!take.length) return opts.length === 0;       // must capture when possible
  const key = [...take].sort().join();
  return opts.some(o => [...o].sort().join() === key);
}

// ================= Helpers =================
const $ = q => document.querySelector(q);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function lsGet(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const randCode = (n = 5) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPH[b % ALPH.length]).join('');
const randToken = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
const peerId = code => 'scopa-tra-amici-' + code.toLowerCase();
const inviteLink = code => location.origin + location.pathname + '#' + code;
let wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (role)) keepAwake(); });

// ================= Networking =================
// The host's phone holds the real game and sends each player only what they may see.
let role = null;            // 'host' | 'guest'
let peer = null, conn = null;
let S = null;               // host: full state
let V = null;               // what this phone renders (filtered view)
let mySeat = -1, code = '', password = '', netOk = false, retryT = null;
const conns = {};           // host: seat -> DataConnection

function viewFor(seat) {
  const v = clone(S);
  delete v.password; v.players = v.players.map(p => ({ seat: p.seat, nick: p.nick, online: p.seat === 0 ? true : !!(conns[p.seat] && conns[p.seat].open) }));
  if (v.hand) {
    v.hand.deck = Array(S.hand.deck.length).fill('x');
    for (const k of Object.keys(v.hand.hands)) if (+k !== seat) v.hand.hands[k] = Array(S.hand.hands[k].length).fill('x');
  }
  v.code = code; v.mySeat = seat;
  return v;
}
function saveHost() { lsSet('scopa.host', JSON.stringify({ code, password, S })); }
function broadcast() {
  saveHost();
  for (const p of S.players) {
    if (p.seat === 0) continue;
    const c = conns[p.seat]; if (c && c.open) { try { c.send({ t: 'state', v: viewFor(p.seat) }); } catch {} }
  }
  V = viewFor(0); render();
}

function startHost(c, pw, nick, nPlayers, target, resumeState) {
  role = 'host'; code = c; password = pw; mySeat = 0;
  S = resumeState || { nPlayers, target, status: 'lobby', players: [{ seat: 0, nick, token: 'host' }], scores: {}, hand: null, result: null, dealer: 0 };
  saveHost(); V = viewFor(0); render(); keepAwake();
  openHostPeer();
}
function openHostPeer() {
  if (peer) { try { peer.destroy(); } catch {} }
  peer = new Peer(peerId(code));
  peer.on('open', () => { netOk = true; V = viewFor(0); render(); });
  peer.on('connection', c => {
    c.on('data', m => onHostMsg(c, m));
    c.on('close', () => { for (const k in conns) if (conns[k] === c) delete conns[k]; broadcast(); });
  });
  peer.on('disconnected', () => { netOk = false; render(); setTimeout(() => { try { peer.reconnect(); } catch {} }, 1500); });
  peer.on('error', e => {
    netOk = false; render();
    if (e.type === 'unavailable-id') { toast('Il codice è ancora occupato, riprovo…'); clearTimeout(retryT); retryT = setTimeout(openHostPeer, 4000); }
    else if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error' || e.type === 'socket-closed') { clearTimeout(retryT); retryT = setTimeout(openHostPeer, 4000); }
  });
}
function onHostMsg(c, m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'join') {
    if (String(m.pw) !== password) { c.send({ t: 'err', m: 'Password sbagliata.' }); setTimeout(() => c.close(), 300); return; }
    let p = S.players.find(x => x.token === m.token && x.seat !== 0);
    if (!p) {
      if (S.status !== 'lobby' || S.players.length >= S.nPlayers) { c.send({ t: 'err', m: 'La partita è già al completo.' }); setTimeout(() => c.close(), 300); return; }
      const nick = String(m.nick || 'Giocatore').slice(0, 16);
      const free = [...Array(S.nPlayers).keys()].find(i => !S.players.some(x => x.seat === i));
      p = { seat: free, nick, token: String(m.token).slice(0, 40) };
      S.players.push(p); S.players.sort((a, b) => a.seat - b.seat);
    }
    if (conns[p.seat] && conns[p.seat] !== c) { try { conns[p.seat].close(); } catch {} }
    conns[p.seat] = c;
    broadcast(); return;
  }
  const seat = +Object.keys(conns).find(k => conns[k] === c);
  if (isNaN(seat)) return;
  handleAction(seat, m);
}
function handleAction(seat, m) {
  if (m.t === 'play') { if (!validMove(S, seat, m.card, m.take)) return; applyMove(S, seat, m.card, m.take); }
  else if (m.t === 'next') { if (S.status !== 'handEnd') return; S.dealer = (S.dealer + 1) % S.nPlayers; dealHand(S); }
  else if (m.t === 'start' && seat === 0) {
    if (S.status !== 'lobby' || S.players.length !== S.nPlayers) return;
    S.scores = {}; for (let t = 0; t < nTeams(S); t++) S.scores[t] = 0;
    S.dealer = Math.floor(Math.random() * S.nPlayers); S.hand = null; dealHand(S);
  }
  else if (m.t === 'rematch') { if (S.status !== 'over') return; for (let t = 0; t < nTeams(S); t++) S.scores[t] = 0; S.dealer = (S.dealer + 1) % S.nPlayers; S.hand.handNo = 0; dealHand(S); }
  else if (m.t === 'kick' && seat === 0) {
    if (S.status !== 'lobby' || m.seat === 0) return;
    const c = conns[m.seat]; if (c) { try { c.send({ t: 'err', m: 'Sei stato tolto dal tavolo.' }); c.close(); } catch {} delete conns[m.seat]; }
    S.players = S.players.filter(p => p.seat !== m.seat);
  }
  else return;
  broadcast();
}

function startGuest(c, pw, nick) {
  role = 'guest'; code = c; password = pw;
  let token = lsGet('scopa.token.' + c); if (!token) { token = randToken(); lsSet('scopa.token.' + c, token); }
  lsSet('scopa.guest', JSON.stringify({ code: c, pw, nick }));
  V = null; render(); keepAwake();
  const connect = () => {
    clearTimeout(retryT);
    if (!peer || peer.destroyed) {
      peer = new Peer();
      peer.on('open', () => connect());
      peer.on('error', e => {
        netOk = false; render();
        if (e.type === 'peer-unavailable') { if (!V) setErr('Nessuna partita aperta con questo codice. Controlla il codice e che chi ha creato la partita abbia il gioco aperto.'); retryT = setTimeout(connect, 4000); }
        else { retryT = setTimeout(() => { try { peer.destroy(); } catch {} peer = null; connect(); }, 4000); }
      });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
      return;
    }
    if (!peer.open) return;
    conn = peer.connect(peerId(c), { reliable: true });
    conn.on('open', () => { netOk = true; conn.send({ t: 'join', pw, nick, token }); render(); });
    conn.on('data', m => {
      if (m?.t === 'state') { V = m.v; mySeat = V.mySeat; netOk = true; render(); }
      else if (m?.t === 'err') { stopGuest(); goHome(m.m); }
    });
    conn.on('close', () => { if (role !== 'guest') return; netOk = false; render(); retryT = setTimeout(connect, 2500); });
  };
  connect();
}
function stopGuest() { role = null; clearTimeout(retryT); try { conn?.close(); } catch {} try { peer?.destroy(); } catch {} peer = null; conn = null; lsDel('scopa.guest'); }
function act(m) { if (role === 'host') handleAction(0, m); else if (conn && conn.open) conn.send(m); else toast('Non sei collegato: aspetta qualche secondo.'); }

// ================= Views =================
const app = $('#app');
let sel = null, createN = 2, homeErr = '';
function setErr(t) { const e = $('#jerr'); if (e) e.textContent = t; else toast(t); }

function goHome(err = '') {
  if (role === 'host') { try { peer?.destroy(); } catch {} peer = null; }
  role = null; V = null; S = null; homeErr = err; render();
}

function render() {
  if (!role) return renderHome();
  if (!V) return renderConnecting();
  if (V.status === 'lobby') return renderWait();
  renderGame();
}

function renderHome() {
  const prefill = (location.hash.slice(1) || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
  const saved = (() => { try { return JSON.parse(lsGet('scopa.host') || 'null'); } catch { return null; } })();
  const resume = saved && saved.S && saved.S.status !== 'over' ? saved : null;
  app.innerHTML = `
    <div class="hero"><div class="fan">${cardHTML('c1')}${cardHTML('d7')}${cardHTML('s10')}</div><div><div class="eyebrow">40 carte · 2–4 giocatori</div><h1>Scopa</h1></div></div>
    <label for="nick">Il tuo nome<input id="nick" maxlength="16" autocomplete="nickname" placeholder="Es. Teo" value="${esc(lsGet('scopa.nick'))}"></label>
    ${resume ? `<div class="panel"><h3>Partita in sospeso</h3><p class="muted">Codice ${esc(resume.code)} · ${resume.S.players.map(p => esc(p.nick)).join(', ')}</p><div class="row"><button class="grow" id="resume">Riprendi la partita</button><button class="ghost" id="drop">Chiudila</button></div></div>` : ''}
    <form id="join" class="panel" novalidate>
      <h3>Entra in una partita</h3>
      <div class="row"><label class="grow" for="jcode">Codice partita<input id="jcode" class="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE" value="${esc(prefill)}"></label>
      <label class="grow" for="jpw">Password<input id="jpw" type="password" autocomplete="off" placeholder="Te l'ha data chi l'ha creata"></label></div>
      <p class="err" id="jerr">${esc(homeErr)}</p>
      <button type="submit">Entra</button>
    </form>
    <form id="create" class="panel" novalidate>
      <h3>Crea una partita</h3>
      <div><label>Giocatori</label><div class="seg" id="nseg" style="margin-top:6px">${[2,3,4].map(n => `<button type="button" data-n="${n}" aria-pressed="${n===createN}">${n}${n===4?' a coppie':''}</button>`).join('')}</div></div>
      <label for="target">Si gioca fino a<select id="target"><option value="11" selected>11 punti</option><option value="16">16 punti</option><option value="21">21 punti</option></select></label>
      <label for="cpw">Scegli una password<input id="cpw" type="password" autocomplete="new-password" placeholder="Almeno 3 caratteri"></label>
      <p class="err" id="cerr"></p>
      <button type="submit">Crea partita</button>
      <p class="muted" style="font-size:.85rem">Tieni il gioco aperto sul tuo telefono finché giocate: la partita vive lì.</p>
    </form>`;
  homeErr = '';
  const nickOk = () => { const n = $('#nick').value.trim(); if (!n) { toast('Scrivi prima il tuo nome.'); $('#nick').focus(); return null; } lsSet('scopa.nick', n); return n; };
  $('#nseg').onclick = e => { const b = e.target.closest('button'); if (!b) return; createN = +b.dataset.n; $('#nseg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.n === createN)); };
  $('#create').onsubmit = e => {
    e.preventDefault(); const nick = nickOk(); if (!nick) return;
    const pw = $('#cpw').value; if (pw.length < 3) { $('#cerr').textContent = 'La password deve avere almeno 3 caratteri.'; return; }

    e.preventDefault(); const nick = nickOk(); if (!nick) return;

    if (!pw) { $('#jerr').textContent = 'Scrivi la password.'; return; }
    startGuest(c, pw, nick);
  };

    $('#resume').onclick = () => startHost(resume.code, resume.password, resume.S.players[0].nick, 0, 0, resume.S);
    $('#drop').onclick = () => { lsDel('scopa.host'); renderHome(); };
  }

function renderConnecting() {
  app.innerHTML = `<div class="top"><button class="ghost" id="back">← Esci</button></div>
    <div class="panel"><div class="eyebrow">Partita ${esc(code)}</div><h2>Mi collego al tavolo…</h2>
    <p class="muted">Chi ha creato la partita deve avere il gioco aperto sul telefono.</p><p class="err" id="jerr"></p></div>`;
  $('#back').onclick = () => { stopGuest(); goHome(); };
}

const connPill = () => netOk ? '<span class="pill ok">Collegato</span>' : '<span class="pill bad">Ricollego…</span>';

function renderWait() {
  const s = V, full = s.players.length === s.nPlayers, host = role === 'host';
  const seats = [...Array(s.nPlayers).keys()].map(i => {
    const pl = s.players.find(x => x.seat === i);
    const team = s.nPlayers === 4 ? `<span class="pill">Coppia ${i % 2 ? 'B' : 'A'}</span>` : '';
    const kick = host && pl && i !== 0 ? `<button class="danger small" data-kick="${i}">Togli</button>` : '';
    return `<div class="seat ${pl ? 'full' : ''}"><span>${pl ? esc(pl.nick) + (i === mySeat ? ' <span class="muted">(tu)</span>' : '') + (pl.online ? '' : ' <span class="muted">· offline</span>') : '<span class="muted">Posto libero</span>'}</span><span class="row">${team}${kick}</span></div>`;
  }).join('');
  app.innerHTML = `
    <div class="top"><button class="ghost" id="back">← Esci</button>${connPill()}</div>
    <div class="panel">
      <div class="eyebrow">Sala d'attesa · a ${s.target} punti</div>
      <p class="muted">Codice partita</p>
      <div class="bigcode">${esc(s.code)}</div>
      ${host ? `<button class="ghost" id="copy">Copia link d'invito</button><p class="muted" style="font-size:.85rem">Manda il link e, a parte, la password. Il link contiene già il codice.</p>` : ''}
      ${s.nPlayers === 4 ? '<p class="muted">Si gioca a coppie: 1° e 3° contro 2° e 4°.</p>' : ''}
      <div class="seats">${seats}</div>
      ${host ? `<button id="start" ${full ? '' : 'disabled'}>${full ? 'Inizia la partita' : `Aspetto ${s.nPlayers - s.players.length} giocator${s.nPlayers - s.players.length === 1 ? 'e' : 'i'}`}</button>` : `<p class="status">${full ? 'Ci siete tutti: ' + esc(s.players[0].nick) + ' sta per iniziare.' : 'Aspettiamo gli altri giocatori…'}</p>`}
    </div>`;
  bindExit();
  if (host) {
    $('#start').onclick = () => act({ t: 'start' });
    $('#copy').onclick = async () => { const l = inviteLink(code); try { await navigator.clipboard.writeText(l); toast('Link copiato'); } catch { toast(l); } };
    app.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => act({ t: 'kick', seat: +b.dataset.kick }));

}

function bindExit() {
  const b = $('#back');
  b.onclick = () => {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = role === 'host' ? 'Tocca ancora: chiudi la partita' : 'Tocca ancora per uscire'; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.textContent = '← Esci'; } }, 4000); return; }
    if (role === 'host') { for (const k in conns) { try { conns[k].send({ t: 'err', m: 'Chi ha creato la partita l\'ha chiusa.' }); } catch {} } setTimeout(() => goHome(), 200); }
    else { stopGuest(); goHome(); }
  };
}

function moveText(s) {
  const m = s.hand.lastMove;
  if (!m) return s.hand.handNo > 1 ? 'Nuova mano. Apre ' + esc(s.players[s.hand.turn].nick) + '.' : 'Si comincia!';
  const who = esc(s.players[m.seat].nick);
  let txt = m.take.length ? `${who} gioca <b>${cardName(m.card)}</b> e prende ${m.take.map(cardName).join(' + ')}` : `${who} cala <b>${cardName(m.card)}</b>`;
  if (m.scopa) txt += ' · <span class="scopa">Scopa!</span>';
  return txt;
}

function renderGame() {
  const s = V, h = s.hand, my = mySeat, n = s.nPlayers, myTeam = teamOf(s, my);
  const myTurn = s.status === 'playing' && h.turn === my;
  const myHand = h.hands[my] || [];
  if (sel && (!myHand.includes(sel) || !myTurn)) sel = null;
  const opts = sel ? captureOptions(sel, h.table) : [];
  const optCards = new Set(opts.flat());
  const score = [...Array(nTeams(s)).keys()].map(t => `<div class="score ${t === myTeam ? 'mine' : ''}"><span>${esc(teamName(s, t))}</span><b>${s.scores[t] || 0}</b></div>`).join('');
  const opps = [];
  for (let k = 1; k < n; k++) {
    const i = (my + k) % n, p = s.players[i], cnt = (h.hands[i] || []).length, tm = teamOf(s, i);
    const mate = n === 4 && tm === myTeam ? 'Compagno · ' : '';
    opps.push(`<div class="opp ${s.status === 'playing' && h.turn === i ? 'turn' : ''} ${p.online ? '' : 'away'}"><div class="backs">${Array.from({length: cnt}, backHTML).join('') || '<span class="sub">—</span>'}</div><div style="min-width:0"><div class="nm">${esc(p.nick)}</div><div class="sub">${p.online ? '' : 'offline · '}${mate}${h.caps[tm].length} prese · ${h.scope[tm]} scope</div></div></div>`);
  }
  const freshCard = h.lastMove && !h.lastMove.take.length ? h.lastMove.card : null;
  const tableHTML = h.table.length ? h.table.map(c => cardHTML(c, (optCards.has(c) ? 'opt ' : '') + (c === freshCard ? 'fresh' : ''))).join('')
    : `<p class="empty-felt">${h.lastMove?.scopa ? 'Scopa!' : 'Tavolo vuoto'}</p>`;
  const status = s.status !== 'playing' ? 'Mano finita' : myTurn ? 'Tocca a te: scegli una carta' : 'Tocca a ' + esc(s.players[h.turn].nick);
  const lastPlay = !h.deck.length && Object.keys(h.hands).every(k => h.hands[k].length === (+k === my ? 1 : 0));
  let actions = '';
  if (myTurn && sel) {
    actions = !opts.length ? `<button data-take="">Cala ${cardName(sel)} sul tavolo</button>`
      : opts.map((o, i) => `<button data-take="${i}">Prendi ${o.map(cardName).join(' + ')}${o.length === h.table.length && !lastPlay ? ' · Scopa!' : ''}</button>`).join('');
  } else if (myTurn) actions = '<p class="muted" style="text-align:center">Tocca una carta della tua mano.</p>';

  app.innerHTML = `
    <div class="top"><button class="ghost" id="back">← Esci</button><span class="pill">Partita ${esc(s.code)} · a ${s.target}</span></div>
    <div class="scorebar">${score}</div>
    <div class="opps">${opps.join('')}</div>
    <div class="felt">
      <div class="conn">${connPill()}</div>
      <div class="deck">${h.deck.length ? backHTML() : ''}<span>${h.deck.length ? h.deck.length + ' nel mazzo' : 'Mazzo finito'}</span></div>
      <div class="tablecards">${tableHTML}</div>
      <p class="banner">${moveText(s)}</p>
    </div>
    <p class="status ${myTurn ? 'me' : ''}">${status}</p>
    <div class="hand ${myTurn ? '' : 'off'}" id="hand">${myHand.map(c => `<button class="card s-${suit(c)} ${c === sel ? 'sel' : ''}" data-c="${c}" ${myTurn ? '' : 'disabled'} aria-label="${cardName(c)}">${cardInner(c)}</button>`).join('') || '<p class="muted" style="align-self:center">Aspetta la prossima distribuzione.</p>'}</div>
    <div class="actions" id="acts">${actions}</div>
    <div class="mystats"><span>${n === 4 ? 'Prese della coppia' : 'Le tue prese'}: ${h.caps[myTeam].length} carte · ${h.scope[myTeam]} scope</span><span>Mano ${h.handNo}</span></div>
    ${s.status === 'handEnd' || s.status === 'over' ? resultHTML(s) : ''}`;
  bindExit();
  $('#hand').onclick = e => { const b = e.target.closest('button[data-c]'); if (!b || !myTurn) return; sel = sel === b.dataset.c ? null : b.dataset.c; renderGame(); };
  $('#acts').onclick = e => { const b = e.target.closest('button[data-take]'); if (!b) return; const take = b.dataset.take === '' ? [] : opts[+b.dataset.take]; const card = sel; sel = null; act({ t: 'play', card, take }); };
  const nx = $('#nexthand'); if (nx) nx.onclick = () => act({ t: 'next' });
  const rv = $('#rematch'); if (rv) rv.onclick = () => act({ t: 'rematch' });
}

function resultHTML(s) {
  const r = s.result, T = [...Array(nTeams(s)).keys()], over = s.status === 'over';
  const head = T.map(t => `<th>${esc(teamName(s, t))}</th>`).join('');
  const rows = r.rows.map(row => `<tr><td>${row.k}</td>${T.map(t => `<td class="${row.w === t ? 'win' : ''}">${row.v[t]}</td>`).join('')}</tr>`).join('');
  const sweep = s.hand.lastMove?.sweep ? `<p class="muted">Le ${s.hand.lastMove.sweep} carte rimaste in tavola vanno a ${esc(teamName(s, s.hand.lastMove.sweepTeam))}, l'ultimo a prendere.</p>` : '';
  return `<div class="overlay"><div class="panel" role="dialog" aria-label="Risultato della mano">
    <div class="eyebrow">${over ? 'Partita finita' : 'Fine della mano ' + s.hand.handNo}</div>
    <h2>${over ? 'Vince ' + esc(teamName(s, s.winner)) + '!' : 'Conta dei punti'}</h2>
    ${sweep}
    <div class="tbl-wrap"><table><thead><tr><th></th>${head}</tr></thead><tbody>${rows}
      <tr class="tot"><td>Punti mano</td>${T.map(t => `<td>+${r.pts[t]}</td>`).join('')}</tr>
      <tr class="tot"><td>Totale</td>${T.map(t => `<td>${s.scores[t]} / ${s.target}</td>`).join('')}</tr></tbody></table></div>
    ${over ? '<button id="rematch">Rivincita</button>' : '<button id="nexthand">Prossima mano</button>'}
  </div></div>`;
}

// ================= Boot =================
(function boot() {
  if (typeof Peer === 'undefined') { app.innerHTML = '<div class="panel"><h2>Connessione assente</h2><p class="muted">Non riesco a caricare il gioco. Controlla internet e ricarica la pagina.</p></div>'; return; }
  const g = (() => { try { return JSON.parse(lsGet('scopa.guest') || 'null'); } catch { return null; } })();
  const hashCode = location.hash.slice(1).toUpperCase();
  if (g && g.code && (!hashCode || hashCode === g.code)) startGuest(g.code, g.pw, g.nick);   // rejoin after a reload
  else render();
})();
</script>
</body>
</html>
